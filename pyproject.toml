[project]
name = "bucket-loadtest"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "click>=8.5,<9",
    "locust",
    "packaging",
    "rich>=15.0.0",
]

[project.scripts]
pulp-juicer = "pulp_juicer.cli:cli"

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulp_juicer", "src/experiments"]

[dependency-groups]
report = [
    "quarto-cli==1.10.19",
]
